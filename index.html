<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RPG Memes - Mesa do Mestre</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body style="--brilho-xp-escala: 1;">

    <div id="modal-exp" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div style="background: #1c130d; border: 3px double #d4af37; padding: 25px; border-radius: 8px; width: 300px; box-shadow: 0 0 30px #000, inset 0 0 20px rgba(0,0,0,0.8); text-align: center;">
            <h3 style="color:#d4af37; margin-top:0; border-bottom: 1px dashed #5c3a21; padding-bottom: 10px;">✨ Distribuir EXP</h3>
            <div style="text-align: left; margin: 15px 0; display: flex; flex-direction: column; gap: 8px;" id="modal-exp-checkboxes">
                <label class="checkbox-alvo"><input type="checkbox" class="exp-target" value="lais"> Lais</label>
                <label class="checkbox-alvo"><input type="checkbox" class="exp-target" value="gomes"> Gomes</label>
                <label class="checkbox-alvo"><input type="checkbox" class="exp-target" value="kamy"> Kamy</label>
                <label class="checkbox-alvo"><input type="checkbox" class="exp-target" value="arthur"> Arthur</label>
            </div>
            <input type="number" id="exp-amount-input" placeholder="Qtd. de Experiência (+ ou -)" style="margin-bottom: 15px;">
            <div style="display: flex; gap: 10px;">
                <button onclick="aplicarExpLote()" style="flex: 1; background: linear-gradient(to bottom, #d4af37, #8b6d43); color: #000;">Aplicar</button>
                <button onclick="fecharModalExp()" style="flex: 1; border-color: #8c1c13; color: #d95757;">Cancelar</button>
            </div>
        </div>
    </div>

    <button id="btn-toggle-hud" onclick="toggleHudMestre()">👁️ Grupo</button>
    <div id="hud-mestre">
        <div style="color: #8b6d43; text-align: center; font-size: 10px; font-weight: bold; border-bottom: 1px solid #3a2212; padding-bottom: 8px; margin-bottom: 5px; letter-spacing: 2px;">STATUS DO GRUPO</div>
        <div id="hud-players-list"></div>
    </div>

    <div id="tela-login">
        <h2 style="color: #d4af37; margin-bottom: 5px; letter-spacing: 3px; text-shadow: 2px 2px 5px black; font-size: 28px;">RPG MEMES</h2>
        <p style="color: #9c8464; font-size: 14px; margin-bottom: 25px; font-style: italic;">Declare sua identidade, viajante</p>
        <input type="text" id="input-senha" placeholder="Insira seu nome..." style="text-align: center; font-size: 16px; margin-bottom: 20px;">
        <button style="width: 100%; padding: 14px; font-size: 14px;" onclick="fazerLogin()">Adentrar no mundo</button>
        <p id="msg-erro" style="color: #8c1c13; font-size: 13px; margin-top: 15px; display: none; font-weight: bold;">As chamas não reconhecem este nome.</p>
    </div>

    <div id="tela-app">
        <div class="nav-bar">
            <div class="nav-info">
                Identidade: <strong id="usuario-logado" style="color: #d4af37; font-size: 16px;"></strong> 
                <span id="badge-cargo" style="background: #0a0503; padding: 3px 10px; border: 1px solid #5c3a21; font-size: 10px; margin-left: 8px; vertical-align: middle;"></span>
            </div>
            
            <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                
                <div id="seletor-jogador" style="display: none;">
                    <label style="display: inline-block; margin-bottom: 0;">Seu Personagem:</label>
                    <span id="nome-heroi-jogador" style="font-weight:bold; color:#d4af37; margin-left: 5px; font-size: 16px; text-transform: uppercase;">Aguardando...</span>
                </div>

                <div id="painel-mestre" class="painel-mestre">
                    <button class="btn-exp-master" onclick="abrirModalExp()">✨ Distribuir EXP</button>
                    <div class="painel-mestre-box" style="margin-left: 10px; border-left: 1px dashed #6b1d1d; padding-left: 15px;">
                        <label style="margin-bottom: 0; color: #b89c72;">TELA 1:</label>
                        <select id="mestre-t1-player" onchange="mestreAbrir(1, 'heroi', this.value)">
                            <option value="">👤 Jogadores...</option>
                        </select>
                        <select id="mestre-t1-monstro" onchange="mestreAbrir(1, 'monstro', this.value)">
                            <option value="">💀 Monstros...</option>
                        </select>
                        <select id="mestre-t1-horda" onchange="mestreAbrir(1, 'horda', this.value)">
                            <option value="">🛡️ Hordas...</option>
                        </select>
                        <button class="btn-limpar" onclick="mestreLimpar(1)" title="Fechar Tela 1">❌</button>
                    </div>

                    <div class="painel-mestre-box">
                        <label style="margin-bottom: 0; color: #b89c72;">TELA 2:</label>
                        <select id="mestre-t2-player" onchange="mestreAbrir(2, 'heroi', this.value)">
                            <option value="">👤 Jogadores...</option>
                        </select>
                        <select id="mestre-t2-monstro" onchange="mestreAbrir(2, 'monstro', this.value)">
                            <option value="">💀 Monstros...</option>
                        </select>
                        <select id="mestre-t2-horda" onchange="mestreAbrir(2, 'horda', this.value)">
                            <option value="">🛡️ Hordas...</option>
                        </select>
                        <button class="btn-limpar" onclick="mestreLimpar(2)" title="Fechar Tela 2">❌</button>
                    </div>

                    <div style="border-left: 1px dashed #6b1d1d; margin-left: 5px; padding-left: 15px;">
                        <label style="display: inline-block; margin-bottom: 0; color: #a84242;">Ameaça Ativa:</label>
                        <select id="seletor-ameaca" style="border-color: #6b1d1d; font-size:12px; width: 140px;" onchange="selecionarAmeacaMestre(this.value)">
                            <option value="" disabled selected>Nenhum...</option>
                            <optgroup label="Monstros Individuais" id="optgroup-monstros"></optgroup>
                            <optgroup label="Hordas" id="optgroup-hordas"></optgroup>
                        </select>
                    </div>
                    <button class="btn-invocar" onclick="invocarMonstro()">+ Criar Monstro</button>
                    <button class="btn-turno-global" onclick="avancarTurnoGlobal()" style="background: linear-gradient(to bottom, #1e5c2e, #11361a); border-color: #27ae60; color: #fff; text-shadow: 1px 1px 2px black;">⏳ Passar Turno Global</button>
                    <button id="btn-lancar" class="btn-lancar" onclick="lancarAmeaca()" style="display:none;">⚔️ Lançar aos Players</button>
                    <button id="btn-derrotado" class="btn-derrotado" onclick="ameacaDerrotada()" style="display:none;">💀 Ameaça Derrotada</button>
                    <button id="btn-deletar" class="btn-deletar" onclick="deletarAmeaca()" style="display:none;">🗑️ Deletar</button>
                </div>
            </div>
        </div>

        <div class="mesa-de-jogo">
            <div id="slot-1" class="slot-container" style="display: none;"></div>
            <div id="slot-2" class="slot-container" style="display: none;"></div>
        </div>
    </div>

    <!-- MODAL ÁRVORE DE HABILIDADES -->
    <div id="modal-arvore">
        <div class="arvore-container">
            <button class="btn-fechar-arvore" onclick="fecharArvore()">✖ FECHAR</button>
            <div class="arvore-header">
                <h2 class="arvore-titulo">Árvore de Habilidades</h2>
                <div class="arvore-classes-tabs" id="arvore-tabs-container">
                    <!-- As abas das classes serão injetadas via script -->
                </div>
            </div>
            <div class="arvore-content" id="arvore-views-container">
                <!-- As visões das árvores serão injetadas via script -->
            </div>
        </div>
    </div>

    <script type="module" src="script.js?v=3"></script>
</body>
</html>
